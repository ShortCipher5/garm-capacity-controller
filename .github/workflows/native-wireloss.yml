name: Native commit response-loss component
on:
  pull_request:
    paths:
      - '.github/workflows/native-wireloss.yml'
      - 'deploy/runtime/native-wireloss/**'
permissions:
  contents: read
jobs:
  component:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: deploy/runtime/native-wireloss/test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wireloss-evidence
          if-no-files-found: error
          path: |
            qualification-results/native-wireloss/upstream.txt
            qualification-results/native-wireloss/recipe-revision.txt
            qualification-results/native-wireloss/fixture.sha256
            qualification-results/native-wireloss/recipe.sha256
            qualification-results/native-wireloss/base-image.txt
            qualification-results/native-wireloss/packages.tsv
            qualification-results/native-wireloss/go-version.txt
            qualification-results/native-wireloss/test.txt
            qualification-results/native-wireloss/result.txt
            qualification-results/native-wireloss/driver-source.sha256
