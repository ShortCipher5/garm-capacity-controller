name: model-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: gofmt -d .
      - run: test -z "$(gofmt -l .)"
      - run: test "$(go env CGO_ENABLED)" = 1
      - name: Verify reviewed Incus host setup (no host mutations)
        run: python3 -B -m unittest discover -s internal/incussetup -p recipe_test.py -v
      - name: Prepared diagnostic parser and hash checks (no root execution)
        run: python3 -B -m unittest discover -s internal/nativeprovision -p diagnostic_test.py -v
      - name: Validate bounded native asset upload recipe
        run: python3 -B -m unittest discover -s internal/nativeassettransfer -p '*test.py' -v
      - name: Validate stock inventory and GitHub recovery observers without secrets
        run: |
          python3 -B -m unittest discover -s deploy/runtime/hosted-incus -p 'test_*.py' -v
          python3 -B -m unittest discover -s deploy/runtime/stock-inventory -p 'test_*.py' -v
          python3 -B -m unittest discover -s deploy/runtime/trusted-job-recovery -p 'test_*.py' -v
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Require actual Unix packet sender credentials and pidfd
        env:
          GCC_SENDER_PIDFD_TESTS: "1"
        run: go test -race -count=1 -timeout=60s -run "^TestPacketSender" -v ./internal/supervisorsender
      - name: Require fixed unprivileged post-entry witness (not sandbox qualification)
        env:
          GCC_M2_ENTRY_WITNESS_TESTS: "1"
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          go test -race -count=1 -timeout=60s -run "^TestM2Entry" -v ./qualification/m2entry
