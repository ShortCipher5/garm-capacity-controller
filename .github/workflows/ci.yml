name: model-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: gofmt -d .
      - run: test -z "$(gofmt -l .)"
      - run: test "$(go env CGO_ENABLED)" = 1
      - run: go vet ./...
      - name: Require real disposable Unix audit endpoint tests
        env:
          GCC_AUDIT_UNIX_BIND_TESTS: '1'
        run: go test -race -count=1 -timeout=60s -run '^TestUnixAudit' -v ./internal/supervisoraudit
      - run: go test -race -count=1 ./...
