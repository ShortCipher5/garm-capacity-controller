name: disposable-packaging-checks
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/packaging.yml
      - deploy/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - web/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build digest-locked artifacts and exercise isolated Compose topology
        run: deploy/runtime/test.sh
      - name: Report boundaries without uploading fixtures or credentials
        if: always()
        shell: bash
        run: |
          echo '## Disposable packaging checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job uses synthetic loopback APIs and generated one-run credentials only. A passing generic harness is not installed-stack qualification or deployment permission.' >> "$GITHUB_STEP_SUMMARY"
          if test -f qualification-results/garm-compatibility.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat qualification-results/garm-compatibility.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packaging-public-status
          path: qualification-results/*.json
          if-no-files-found: ignore
          retention-days: 7
  upstream-garm-nonroot-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise exact public Garm image without root or capabilities
        run: deploy/runtime/garm-least-privilege.sh
      - name: Summarize disposable-only boundary
        if: always()
        shell: bash
        run: |
          echo '## Stock Garm non-root lab' >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated empty state only. No live volumes, provider configuration, credentials, jobs or installation migration. A pass does not qualify any installed stack.' >> "$GITHUB_STEP_SUMMARY"
          if test -f qualification-results/garm-nonroot-lab.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat qualification-results/garm-nonroot-lab.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: garm-nonroot-lab-public-status
          path: qualification-results/garm-nonroot-lab.json
          if-no-files-found: ignore
          retention-days: 7
