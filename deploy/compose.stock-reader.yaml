# Standalone opt-in companion project, not an overlay on stock GARM.
# Resolve and independently verify an existing stock container ID before use.
# The inventory and the gateway both require the exact same loopback namespace.
services:
  capacity-stock-reader:
    image: ${CAPACITY_STOCK_READER_IMAGE:?set a reviewed immutable stock reader image digest}
    profiles: [capacity-preview]
    user: "65529:65529"
    network_mode: "container:${CAPACITY_STOCK_CONTAINER_ID:?set the reviewed existing stock container ID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 48
    cpus: 0.5
    mem_limit: 128m
    restart: "no"
    stop_grace_period: 8s
    volumes:
      - type: bind
        source: ${CAPACITY_STOCK_READER_DIR:?set a distinct owner-only inventory directory}
        target: /run/capacity-stock-reader
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
  capacity-gateway:
    image: ${CAPACITY_GATEWAY_IMAGE:?set a reviewed immutable gateway image digest}
    profiles: [capacity-preview]
    user: "65532:65532"
    network_mode: "container:${CAPACITY_STOCK_CONTAINER_ID:?set the reviewed existing stock container ID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 512m
    restart: "no"
    stop_grace_period: 45s
    command: ["-config", "/run/capacity-private/gateway.local.json"]
    volumes:
      - type: bind
        source: ${CAPACITY_PRIVATE_DIR:?set the distinct owner-only gateway directory}
        target: /run/capacity-private
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CAPACITY_STATE_DIR:?set the distinct companion ledger directory}
        target: /var/lib/capacity-gateway
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
